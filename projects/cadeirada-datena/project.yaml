name: cadeirada-datena

source:
  image: refs/cadeirada.png
  # a arte ja nasce enquadrada (1536 x 1024). O corte so tira o ceu vazio de
  # cima; as figuras SANGRAM de proposito pelos lados e por baixo, como um
  # frame de transmissao — por isso `mask.border_frac: 0` la embaixo.
  crop: [0, 118, 1536, 1024]

# --------------------------------------------------------------------------- #
# quem fala o que — ver typo/regions.py
# --------------------------------------------------------------------------- #
text:
  # stream DEFAULT = o que vale fora de qualquer regiao. Aqui e a CADEIRA:
  # o objeto do escandalo carrega os numeros do pais.
  file: text/brasil.txt
  mode: phrases
  repeat: 120

  regions:
    # a ordem e ordem de PINTURA: quem vem depois cobre quem veio antes.
    - name: datena
      file: text/datena.txt
      polygons:
        - [[-0.020, 0.353], [0.098, 0.327], [0.176, 0.276], [0.260, 0.284],
           [0.319, 0.348], [0.332, 0.498], [0.365, 0.516], [0.417, 0.530],
           [0.475, 0.567], [0.514, 0.632], [0.508, 0.707], [0.456, 0.766],
           [0.365, 0.814], [0.273, 0.870], [-0.020, 0.900]]

    - name: marcal
      file: text/marcal.txt
      # a borda esquerda desce numa quase-vertical em x~0.585, encostando so na
      # palma levantada e no antebraco que empurra. O encosto preto da cadeira e
      # a mao que agarra o topo ficam FORA -> stream default (Brasil): o objeto
      # do escandalo, e as maos brigando por ele, carregam os numeros do pais.
      polygons:
        - [[0.585, 0.030], [1.016, 0.030], [1.016, 0.910], [0.736, 0.910],
           [0.736, 0.760], [0.729, 0.589], [0.700, 0.498], [0.684, 0.425],
           [0.651, 0.366], [0.618, 0.327], [0.586, 0.273], [0.585, 0.100]]

    # as bancadas do debate — o cargo em disputa. Pintadas por ULTIMO: abaixo
    # da linha da mesa tudo que e escuro e bancada.
    - name: bancadas
      file: text/bancada.txt
      boxes: [[-0.02, 0.855, 1.02, 1.02]]

page:
  mode: from_art
  art_height_cm: 62
  margins_cm: { top: 13, bottom: 10.5, side: 7 }
  dpi_export: 150

titles:
  title: "CADEIRADA"
  subtitle: "DEBATE À PREFEITURA DE SÃO PAULO · 15 DE SETEMBRO DE 2024"
  footer: "EXPERIMENTO TIPOGRÁFICO — GUSTAVO JANNUZZI"

accent:
  enabled: false

landscape:
  enabled: false                    # fundo chapado, sem horizonte: nao ha contorno

mask:
  enabled: true
  lum_threshold: 0.56
  border_frac: 0.0                  # a arte sangra pelas bordas de proposito

style_preset: magalenha
style_overrides:
  font:
    family: Arial Narrow            # bold de verdade (ARIALNB.TTF): o
    base_line_mm: 4.0               # bold_threshold so vale com dois arquivos
    size_min_mm: 1.6
    size_max_ratio: 1.8
    size_gamma: 1.3
    bold_threshold: 0.45
  layout:
    advance_factor: 0.90
    row_step_ratio: 0.86

notes: |
  RASCUNHO — em construcao.
