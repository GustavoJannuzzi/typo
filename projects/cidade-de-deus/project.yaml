notes: |
  DECISÃO DE CROP: fiquei em dúvida entre recortar só a foto ou usar a
  composição inteira. Testei as duas — a composição inteira (`crop: null`)
  venceu de forma clara: o letreiro gigante "CIDADE DE DEUS" da capa original
  vira LETRA FEITA DE LETRA, as tipas enormes preenchidas por frases
  minúsculas. É o conceito do projeto aplicado à própria tipografia.

  AJUSTE (feedback do Gustavo): a coluna de escrita japonesa do lado direito
  da capa original não combinava com o resto — ele pediu para tirar, mas
  manter tudo o mais. Medi a imagem (perfil de coluna por faixa de linha) e
  descobri que a coluna de kanji fica isolada: x=631-729, restrita às linhas
  0-607 (só na área da foto). O título não passa de x=562 e o selo
  "PARENTAL ADVISORY" mora em x=645-714 mas nas linhas 760-894 (bem mais
  embaixo, fora da faixa do kanji). Ou seja, cortar a LARGURA da imagem para
  tirar o kanji também cortaria o selo fora — que o Gustavo não pediu para
  tirar.

  Por isso, em vez de um crop retangular, criei `refs/buscape_sem_kanji.png`:
  uma cópia com um retângulo branco pintado só sobre a região do kanji
  (x 620-735, y 0-615, com folga pra pegar o antialiasing das bordas dos
  caracteres). O resto do arquivo — foto, título, selo — é pixel-a-pixel
  igual ao `buscape.jpg` original. Script usado:
  scripts sao descartaveis, mas o retangulo foi: PIL.ImageDraw.rectangle(
  [620, 0, 735, 615], fill=(255,255,255)) sobre uma copia RGB do jpg original.

  `buscape.jpg` continua na pasta como o arquivo original, caso precise
  refazer o recorte de outro jeito.

  Por isso `titles.title: ""` — sem título separado no cabeçalho do poster.
  O nome do filme já está dentro da arte, repetir seria redundante. Mantive
  só o subtítulo (diretores/ano) e o rodapé de crédito.

  Máscara: a arte que o Gustavo fez já vem posterizada, quase bitonal de
  verdade (fundo ~0.95, figura/texto ~0.26-0.34). Foi a máscara mais fácil
  da fila inteira — qualquer limiar entre 0.4 e 0.7 dá o mesmo recorte, sem
  precisar afinar feito nas outras.

  Accent desligado: não há um único pixel colorido na imagem (r=g=b em
  tudo), a regra de accent por vermelho não tem o que pegar.

  Falas: escolhidas pelo Gustavo, substituindo a lista que eu tinha
  pesquisado no Wikiquote.
