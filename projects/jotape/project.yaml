name: jotape

source:
  image: refs/capa.jpg
  crop: [24, 8, 440, 440]           # tira a moldura escura da capa

text:
  file: text/jotape.txt
  mode: phrases

page:
  mode: from_art
  art_height_cm: 88
  margins_cm: { top: 13, bottom: 10.5, side: 7 }
  dpi_export: 150                   # -> página 99 x 111 cm

titles:
  title: "LEANDRO ROQUE"
  subtitle: "JOTAPÊ"
  footer: "EXPERIMENTO TIPOGRÁFICO — GUSTAVO JANNUZZI"

accent:
  enabled: false                    # ver notes: a foto inteira é laranja

mask:
  enabled: false                    # halftone puro, ver notes

landscape:
  enabled: false

style_preset: magalenha
style_overrides:
  colors:
    ink: "#221009"                  # preto quente, não neutro: puxa da luz da foto
  font:
    family: Rockwell Condensed      # slab condensada, peso de cartaz/lambe-lambe
    base_line_mm: 3.0
    size_min_mm: 1.3
    size_max_ratio: 2.05            # faixa larga: 7px a 34px em 150 dpi
    size_gamma: 1.5
    bold_threshold: 0.45
  mask:
    interior_fill_min: 0.05

notes: |
  Capa do álbum, com a tracklist pichada no trailer.

  Máscara DESLIGADA (halftone puro). A cena é escura com o trailer iluminado —
  o corte por `lum < 0.56` seleciona o fundo escuro, não a figura, e o
  resultado sai invertido. Sem máscara, o quadro inteiro vira bloco de texto:
  a pichação lê, a silhueta de dreads lê, e as bordas escuras viram uma moldura
  preta natural. Fica com cara de xilogravura, o que combina com o disco.

  Accent DESLIGADO. Medi as cores da foto: tudo é laranja
  (r-g entre 18 e 104 em toda a imagem), então a regra `red` não isola nada.
  Tentei mirar o coração no peito e o accent caiu na janela acesa do trailer.
  Em vez de forçar, o poster é monocromático em preto quente.
  TODO: quando existir regra de accent por polígono, marcar o coração à mão.

  Sobre a faixa tonal: a primeira versão usava `size_min_mm: 1.7` com
  `size_max_ratio: 1.7` e o export saiu chapado — em 150 dpi as linhas se
  sobrepõem muito mais do que no preview, e a pichação sumiu. O que resolveu
  foi ALARGAR a faixa (piso 1.3 mm, teto 2.05x a linha), não aumentar o piso.
  Regra prática: se o export sair mais chapado que o preview, mexa em
  `size_max_ratio`, não em `size_min_mm`.

  Leitura do material: a letra cita "Se não fosse pelo Leandro Roque" e
  "o feat é com o Emicida" — Leandro Roque de Oliveira é o nome do Emicida,
  então tratei a faixa como homenagem e usei "LEANDRO ROQUE" no título com
  "JOTAPÊ" no subtítulo. Se a leitura estiver invertida, é só trocar os dois.
