[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typo"
version = "0.1.0"
description = "Gerador local de arte tipografica (halftone com letras) — refatoracao do print_v4.py"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Gustavo Jannuzzi" }]
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "img2pdf>=0.5",
    "gradio>=4.44",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# zxing-cpp e' o decodificador INDEPENDENTE do teste do selo: ele le de volta o
# QR que a gente desenhou. Sem um decodificador de terceiro o teste seria
# tautologia ("a matriz que desenhei e a matriz que gerei").
dev = ["pytest>=8.0", "zxing-cpp>=2.2"]
# so' para scripts/make_seal.py: gerar a matriz do QR. Fora do runtime do motor
# de proposito — renderizar arte nao precisa disso.
seal = ["segno>=1.6"]
# so' para scripts/build_brand_assets.py e scripts/build_instagram.py: converter
# as fontes .woff2 da identidade para .ttf (o Pillow nao le woff2). Fora do
# runtime do motor de proposito — nada disso e' preciso pra renderizar arte.
social = ["fonttools>=4.50", "brotli>=1.1"]

[project.scripts]
typo-render = "typo.cli:render_main"
typo-new-project = "typo.cli:new_project_main"
typo-ui = "app.ui:main"

[tool.setuptools]
package-dir = { "typo" = "src/typo", "app" = "app" }
packages = ["typo", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
